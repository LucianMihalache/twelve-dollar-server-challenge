; PHP settings for the server (start.sh points PHP at this file with PHPRC). Only settings inside our own process.

; OPcache: every file is compiled once and kept in shared memory. The files never change while the server runs,
; so PHP is told not to check them on disk again.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.enable_file_override = 1
opcache.save_comments = 1

; The JIT compiles the hot paths of the request loop to machine code.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Paths are resolved once and remembered.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

zend.assertions = -1
zend.enable_gc = 1
expose_php = Off
memory_limit = 128M
max_execution_time = 30
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
